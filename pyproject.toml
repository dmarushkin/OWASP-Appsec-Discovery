[project]
name = "appsec-discovery"
version = "1.1.0"
description = "Discover sensitive objects in project code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitrii Mariushkin", email = "d.v.marushkin@gmail.com" }]
keywords = ["security", "assets", "discovery", "scanning", "appsec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "click>=8.1.7,<9.0.0",
    "graphql-core>=3.2.5,<4.0.0",
    "jschema-to-python>=1.2.3,<2.0.0",
    "openai>=1.60.1,<2.0.0",
    "openapi3-parser>=1.1.19,<1.2",  # private _create_parser is used (swagger/spec.py)
    "prance>=23.6.21,<24",
    "proto-schema-parser>=1.4.2,<2.0.0",
    "pydantic==1.10.13",
    "pyyaml>=6.0.2,<7.0.0",
    "regex>=2024.11.6",  # user rule regexes are matched with a timeout (matching.Pattern)
    "sarif-om>=1.0.4,<2.0.0",
    "semgrep==1.62",
    "sqlglot>=26,<27",
]

[project.urls]
"Homepage" = "https://github.com/dmarushkin/appsec-discovery"
"Bug Tracker" = "https://github.com/dmarushkin/appsec-discovery/issues"

[project.scripts]
appsec-discovery = "appsec_discovery.cli:main"

[dependency-groups]
dev = [
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pytest>=8.3.3,<9.0.0",
    "sqlalchemy==2.0.36",
    "sqlmodel==0.0.22",
]
docs = ["mkdocs-material>=9.5.44,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appsec_discovery"]

[tool.hatch.build.targets.sdist]
include = ["appsec_discovery", "README.md", "LICENSE"]
