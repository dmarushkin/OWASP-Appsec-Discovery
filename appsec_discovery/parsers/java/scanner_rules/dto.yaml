rules:
  - id: dto-javax-data-object
    metadata: {parser: java, object_type: dto, framework: javax}
    languages:
      - java
    severity: INFO
    message: $OBJECT $DB_NAME $FIELD $DB_FIELD $TYPE
    patterns:
      - pattern-either:
          - pattern-inside: |
              @javax.persistence.Table(..., name = $DB_NAME, ...)
              public class $OBJECT {
              ...
              }
          - pattern-inside: |
              @Table(..., name = $DB_NAME, ...)
              public class $OBJECT {
              ...
              }
          - pattern-inside: |
              @javax.persistence.Table(..., name = $DB_NAME, ...)
              private class $OBJECT {
              ...
              }
          - pattern-inside: |
              @Table(..., name = $DB_NAME, ...)
              private class $OBJECT {
              ...
              }
          - pattern-inside: |
              @javax.persistence.Table(..., name = $DB_NAME, ...)
              class $OBJECT {
              ...
              }
          - pattern-inside: |
              @Table(..., name = $DB_NAME, ...)
              class $OBJECT {
              ...
              }
      # bind $TYPE: annotated field declarations (with or without an initializer) and annotated getters (property access)
      - pattern-either:
          - pattern: |
              @javax.persistence.Column(..., name = $DB_FIELD, ...)
              $TYPE $FIELD;
          - pattern: |
              @Column(..., name = $DB_FIELD, ...)
              $TYPE $FIELD;
          - pattern: |
              @javax.persistence.Column(..., name = $DB_FIELD, ...)
              $TYPE $FIELD = ...;
          - pattern: |
              @Column(..., name = $DB_FIELD, ...)
              $TYPE $FIELD = ...;
          - pattern: |
              @javax.persistence.Column(..., name = $DB_FIELD, ...)
              $TYPE $GETTER(...) { ... }
          - pattern: |
              @Column(..., name = $DB_FIELD, ...)
              $TYPE $GETTER(...) { ... }