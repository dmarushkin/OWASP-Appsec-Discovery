parsers:
  - 'swagger'

# Local model served out of process by the llama.cpp server (OpenAI-compatible /v1), e.g.
#   docker run --rm -p 8080:8080 ghcr.io/ggml-org/llama.cpp:server -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
ai_api:
  base_url: "http://localhost:8080/v1"
  model: "local-model"
  timeout: 120
  max_retries: 2
  system_prompt: "You are data security bot, for provided object and it field you must deside does it contain any personal, financial, authorization or other private data with special mesures to store and show."
