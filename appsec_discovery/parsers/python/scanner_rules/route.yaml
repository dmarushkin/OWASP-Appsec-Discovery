rules:
  - id: route-fastapi-object
    metadata: {parser: python, object_type: route, framework: fastapi}
    message: fastapi route `Object $PATH, func $FUNC, type $METHOD`
    languages: [python]
    severity: INFO
    pattern: |
      $APP = fastapi.FastAPI(...)
      ...
      @$APP.$METHOD('$PATH', ...)
      def $FUNC(...):
        ...
  - id: route-flask-object
    metadata: {parser: python, object_type: route, framework: flask}
    message: flask route `Object $PATH, func $FUNC, type $METHOD`
    languages: [python]
    severity: INFO
    patterns:
    - pattern-either:
      - pattern: |
          $APP = flask.Flask(...)
          ...
          @$APP.route('$PATH',methods=[...,'$METHOD',...])
          def $FUNC(...):
            ...
      - pattern: |
          $APP = flask.Flask(...)
          ...
          @$APP.route('$PATH')
          def $FUNC(...):
            ...
  - id: route-django-object
    metadata: {parser: python, object_type: route, framework: django}
    message: django route `Object $PATH, func $FUNC, type $METHOD`
    languages: [python]
    severity: INFO
    patterns:
      - pattern-either:
        - pattern: |
            $URLPATTERNS = [..., django.urls.path($PATH, $FUNC, ...), ...]
        - pattern: |
            $URLPATTERNS = [..., django.conf.urls.path($PATH, $FUNC, ...), ...]
        - pattern: |
            $URLPATTERNS = [..., django.urls.url($PATH, $FUNC, ...), ...]
        - pattern: |
            $URLPATTERNS = [..., django.conf.urls.url($PATH, $FUNC, ...), ...]
  - id: route-bottle-object
    metadata: {parser: python, object_type: route, framework: bottle}
    message: bottle route `Object $PATH, func $FUNC, type $METHOD`
    languages: [python]
    severity: INFO
    patterns:
    - pattern-either:
      - pattern: |
          $APP = bottle.Bottle(...)
          ...
          @$APP.route('$PATH',method=[...,'$METHOD',...])
          def $FUNC(...):
            ...
      - pattern: |
          $APP = bottle.Bottle(...)
          ...
          @$APP.route('$PATH')
          def $FUNC(...):
            ...
      - pattern: |
          @bottle.route('$PATH')
          def $FUNC(...):
            ...
      - patterns:
        - pattern: |
            @bottle.$METHOD('$PATH')
            def $FUNC(...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(?:get|post|put|delete|patch)$
  - id: route-starlette-object
    metadata: {parser: python, object_type: route, framework: starlette}
    message: starlette route `Object $PATH, func $FUNC, type $METHOD`
    languages: [python]
    severity: INFO
    patterns:
    - pattern-either:
      - pattern: |
          $ROUTES = [..., starlette.routing.Route($PATH, $FUNC, ...), ...]
          ...
          $APP = starlette.applications.Starlette(...,routes=$ROUTES,...)
      - pattern: |
          $APP = starlette.applications.Starlette(...,routes=[..., starlette.routing.Route($PATH, $FUNC, ...), ...],...)