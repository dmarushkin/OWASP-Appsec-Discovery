events {
    worker_connections  4096;
}

http {
    # Behind a TLS terminator / load balancer every request comes from its address, so the
    # login rate limit below would be shared by all clients: trust its X-Forwarded-For with
    # discovery_nginx/conf.d/real_ip.conf (copy real_ip.conf.example, set the proxy's CIDR).
    # Without that file $remote_addr is the peer address (direct exposure: nothing to spoof).
    include /etc/nginx/discovery.d/*.conf;

    # P3-2: brute-force protection of the login endpoint (per client, see real_ip above)
    limit_req_zone $binary_remote_addr zone=api_token:10m rate=5r/m;

    server {

        listen 80;

        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /api/token {
            limit_req zone=api_token burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://discovery_api:8000/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP server of the API (streamable HTTP): no buffering, long tool calls; tool calls
        # carry up to 1000 objects / 50000 fields (ingest_objects), larger than the 1m default
        location = /api/mcp {
            client_max_body_size 16m;
            proxy_pass http://discovery_api:8000/mcp;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # external parsers push whole schemas (thousands of tables): larger bodies, longer reads
        location /api/ingest {
            client_max_body_size 64m;
            proxy_pass http://discovery_api:8000/ingest;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://discovery_api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://discovery_ui:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
